<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix Ratings Settings</title>
  <style>
    :root {
      color-scheme: dark only;
      --bg-canvas: #0f172a;
      --bg-surface: #1e293b;
      --bg-input: #0b1220;
      --border-subtle: rgba(148, 163, 184, 0.22);
      --border-strong: rgba(203, 213, 225, 0.35);
      --text-primary: #f8fafc;
      --text-silver: #cbd5e1;
      --text-muted: #94a3b8;
      --accent-gold: #F5C518;
      --accent-gold-hover: #eab308;
      --status-valid: #22c55e;
      --status-invalid: #ef4444;
      --status-pending: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background-color: rgba(245, 197, 24, 0.12);
      border: 1px solid rgba(245, 197, 24, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* Toggle Switch */
    .switch-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .switch-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-silver);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background-color: #334155;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background-color: #f8fafc;
      border-radius: 50%;
      transition: transform 180ms ease;
    }

    .switch input:checked + .slider {
      background-color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    .switch input:checked + .slider::before {
      background-color: #0f172a;
      transform: translateX(18px);
    }

    .switch input:focus-visible + .slider {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    /* Surface Sections */
    .panel {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 12px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-silver);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .helper-link {
      font-size: 11px;
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 500;
    }

    .helper-link:hover {
      text-decoration: underline;
    }

    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }

    .input-group {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    .api-input {
      width: 100%;
      height: 34px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 0 32px 0 10px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      transition: border-color 150ms ease;
    }

    .api-input::placeholder {
      color: #64748b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .api-input:focus {
      outline: none;
      border-color: var(--accent-gold);
    }

    .toggle-visibility-btn {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      border-radius: 5px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 150ms ease, background-color 150ms ease;
    }

    .toggle-visibility-btn:hover {
      color: var(--text-primary);
      background-color: rgba(148, 163, 184, 0.14);
    }

    .btn-primary {
      height: 34px;
      padding: 0 12px;
      background-color: var(--accent-gold);
      color: #0f172a;
      border: none;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, opacity 150ms ease;
    }

    .btn-primary:hover:not(:disabled) {
      background-color: var(--accent-gold-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #64748b;
      flex-shrink: 0;
    }

    .status-row[data-state="valid"] {
      color: #86efac;
    }

    .status-row[data-state="valid"] .status-dot {
      background-color: var(--status-valid);
    }

    .status-row[data-state="invalid"] {
      color: #fca5a5;
    }

    .status-row[data-state="invalid"] .status-dot {
      background-color: var(--status-invalid);
    }

    .status-row[data-state="checking"] {
      color: #fde68a;
    }

    .status-row[data-state="checking"] .status-dot {
      background-color: var(--status-pending);
    }

    /* Cache Section */
    .cache-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .cache-metric {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .cache-count {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .cache-unit {
      font-size: 12px;
      color: var(--text-silver);
    }

    .cache-ttl {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-secondary {
      height: 32px;
      padding: 0 11px;
      background-color: transparent;
      color: var(--text-silver);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: rgba(203, 213, 225, 0.1);
      color: var(--text-primary);
      border-color: rgba(203, 213, 225, 0.55);
    }

    .btn-secondary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      padding-top: 2px;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            fill="#F5C518"
            d="M12 2.2l2.92 5.92 6.53.95-4.72 4.6 1.11 6.5L12 17.1l-5.84 3.07 1.11-6.5-4.72-4.6 6.53-.95L12 2.2z"
          />
        </svg>
      </div>
      <div>
        <h1 class="brand-title">Netflix Ratings</h1>
        <p class="brand-subtitle">IMDb &amp; Rotten Tomatoes</p>
      </div>
    </div>

    <div class="switch-wrap">
      <span id="toggleStateText" class="switch-label">On</span>
      <label class="switch" aria-label="Enable Netflix Ratings extension">
        <input type="checkbox" id="extensionToggle" role="switch" checked />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <section class="panel" aria-labelledby="apiKeySectionTitle">
    <div class="panel-header">
      <h2 id="apiKeySectionTitle" class="panel-title">OMDb API Key</h2>
      <a
        class="helper-link"
        href="https://www.omdbapi.com/apikey.aspx"
        target="_blank"
        rel="noopener noreferrer"
      >Get free key</a>
    </div>

    <form id="apiKeyForm" class="input-row">
      <div class="input-group">
        <input
          type="password"
          id="apiKeyInput"
          class="api-input"
          placeholder="Enter OMDb API key"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          id="toggleVisibilityBtn"
          class="toggle-visibility-btn"
          aria-label="Show API key"
          title="Show or hide API key"
        >
          <svg id="eyeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
      <button type="submit" id="saveKeyBtn" class="btn-primary">Save</button>
    </form>

    <div id="apiStatusRow" class="status-row" data-state="idle" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span id="apiStatusText">Not configured</span>
    </div>
  </section>

  <section class="panel" aria-labelledby="cacheSectionTitle">
    <div class="panel-header">
      <h2 id="cacheSectionTitle" class="panel-title">Local Cache</h2>
    </div>

    <div class="cache-row">
      <div>
        <div class="cache-metric">
          <span id="cacheCount" class="cache-count">0</span>
          <span class="cache-unit">titles cached</span>
        </div>
        <p class="cache-ttl">Stored locally for 7 days</p>
      </div>
      <button type="button" id="clearCacheBtn" class="btn-secondary">Clear Cache</button>
    </div>
  </section>

  <p class="footer-note">Hover thumbnails for 250ms or open any title modal on Netflix.</p>

  <script src="popup.js"></script>
</body>
</html>
